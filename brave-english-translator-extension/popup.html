<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>English Translator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        width: 280px;
        background: #f8fafc;
        color: #111827;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 10px;
        margin: 6px 0;
        cursor: pointer;
        font-weight: 600;
      }
      #translateText { background: #2563eb; color: white; }
      #translateImages { background: #059669; color: white; }
      #translateAll { background: #7c3aed; color: white; }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.4;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <button id="translateText">Translate Page Text → English</button>
    <button id="translateImages">Translate Image Text → English</button>
    <button id="translateAll">Translate Everything</button>
    <div id="status">Ready.</div>
    <script src="popup.js"></script>
  </body>
</html>
